<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login</title>
</head>
<body class="d-flex alingn-itens-center py-4">
    <main class="w-100 m-auto form-container">
        <form>
            <img src="https://agathosagencia.com.br/wp-content/uploads/2025/06/logo-fullautosports-1024x239.webp" class="d-block mx-auto m-4" height="80" width="300">
            <h1 class="h3 mb-3 fw-normal ">LOGIN</h1>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingInput" placeholder="admin">
                <label for="floatingInput">User</label>          
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="floatingInput" placeholder="admin">
                <label for="floatingInput">Password</label>
            </div>

            <div class="form-check text-start my-3">
                <input type="checkbox" class="form-check-input" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">Remember me</label>
            </div>

            <button type="button" class="btn btn-success w-100 py-2" onclick="window.location.href='vendas.html'">Login</button>
        </form>
    </main>
</body>
</html>
