<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/vendas.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/15474/15474969.png" type="image/x-icon">
    <title>GABRIELZINHO IA</title>
</head>

<body class="bg-body-secondary">

    <div id="navbar-container"></div>

    <main class="w-100">
        <h1 class="text-center py-5 fw-bold">GABRIELZINHO IA</h1>

        <div class="w-75 mx-auto">
            <div class="card bg-dark border-secondary shadow-sm mb-4">
                <div class="card-body" id="chat-box" style="height: 400px; overflow-y: auto;">
                    <div class="d-flex flex-column align-items-start mb-3">
                        <span class="badge bg-secondary mb-1">Gabrielzinho IA</span>
                        <div class="p-3 rounded bg-body-tertiary border border-secondary text-light" style="max-width: 80%;">
                            Olá, sou o Gabrielzinho, seu assitente pessoal! Tenho acesso aos dados de <strong>vendas, clientes e produtos</strong> da oficina. O que você gostaria de consultar hoje?
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group input-group-lg mb-5">
                <input type="text" id="input-pergunta" class="form-control bg-dark border-secondary text-light" 
                       placeholder="Ex: Qual foi o valor total da vendas do mês de Maio?" 
                       onkeypress="verificarEnter(event)">
                <button class="btn btn-success fw-semibold px-4" type="button" id="btn-enviar" onclick="enviarPergunta()">
                    🤖 PERGUNTAR
                </button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/assistente_ia.js"></script>
</body>

</html>
