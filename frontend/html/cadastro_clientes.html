<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/15474/15474969.png" type="image/x-icon">    
    <title>Cadastro de Clientes</title>
</head>

<body class="bg-body-secondary">

    <div id="navbar-container"></div>

    <main class="w-100">
        <h1 class="text-center py-5 fw-bold">CADASTRO DE CLIENTES</h1>

        <div class="w-75 mx-auto">
            <form id="form-produto" class="card card-body bg-dark text-white border-secondary">
                <div class="row g-3">
                    <div class="col-md-9">
                        <label for="nome" class="form-label">Nome/Razão Social do CLiente</label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>

                    <!-- (CPF / CNPJ) -->
                    <div class="col-md-3">
                        <label for="tipo_doc" class="form-label">Tipo de Documento</label>
                        <select class="form-select" id="tipo_doc" required>
                            <option value="CPF" selected>CPF</option>
                            <option value="CNPJ">CNPJ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="cpf_cnpj" class="form-label">Número do Documento</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="cpf_cnpj" 
                            placeholder="000.000.000-00" 
                            maxlength="18" 
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="col-md-9">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="cliente@email.com">
                    </div>

                    <div class="col-md-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="cep" placeholder="00000-000" maxlength="9" required>
                    </div>

                    <!-- Rua -->
                    <div class="col-md-9">
                        <label for="rua" class="form-label">Rua / Logradouro</label>
                        <input type="text" class="form-control" id="rua" placeholder="Ex: Av. Brasil" required>
                    </div>

                    <!-- Número -->
                    <div class="col-md-3">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="numero" placeholder="Ex: 123" required>
                    </div>

                    <!-- Cidade -->
                    <div class="col-md-9">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" placeholder="Ex: São Paulo" required>
                    </div>

                    <!-- Estado (UF) -->
                    <div class="col-md-3">
                        <label for="estado" class="form-label">Estado (UF)</label>
                        <select class="form-select" id="estado" required>
                            <option value="" selected disabled>UF...</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>

                </div>
                <button type="submit" class="btn btn-success mt-4 w-100">SALVAR CLIENTE</button>
            </form>
        </div>
    </main>
        

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
</body>


</html>
