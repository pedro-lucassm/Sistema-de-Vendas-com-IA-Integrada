<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/15474/15474969.png" type="image/x-icon">    
    <title>Cadastro de Vendas</title>
</head>

<body class="bg-body-secondary">

    <div id="navbar-container"></div>

    <main class="w-100 pb-5">
        <h1 class="text-center py-5 fw-bold">CADASTRO DE VENDAS</h1>

        <div class="w-75 mx-auto">
            <form id="form-venda" class="card card-body bg-dark text-white border-secondary shadow">
                

                <h5 class="border-bottom border-secondary pb-2 mb-3 text-warning">1. Dados da Venda</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-8">
                        <label for="id_cliente" class="form-label">Cliente</label>
                        <select class="form-select" id="select_cliente" required>
                            <option value="" selected disabled>Selecione um cliente...</option>

                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="data_venda" class="form-label">Data da Venda</label>
                        <input type="datetime-local" class="form-control" id="data_venda" required>
                    </div>
                </div>


                <h5 class="border-bottom border-secondary pb-2 mb-3 text-warning">2. Adicionar Produtos</h5>
                <div class="row g-3 mb-3 align-items-end">
                    <div class="col-md-5">
                        <label for="select_produto" class="form-label">Produto</label>
                        <select class="form-select" id="select_produto">
                            <option value="" selected disabled>Selecione um produto...</option>
           
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="quantidade" class="form-label">Qtd</label>
                        <input type="number" class="form-control" id="quantidade" min="1" value="1">
                    </div>

                    <div class="col-md-3">
                        <label for="preco_unitario" class="form-label">Preço Unitário (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="preco_unitario" placeholder="0.00" readonly>
                    </div>

                    <div class="col-md-2">
                        <button type="button" id="btn-adicionar-item" class="btn btn-primary w-100">+ Adicionar</button>
                    </div>
                </div>


                <div class="table-responsive my-3">
                    <table class="table table-dark table-striped table-hover align-middle border-secondary" id="tabela-itens">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th class="text-center">Qtd</th>
                                <th class="text-end">Preço Un.</th>
                                <th class="text-end">Subtotal</th>
                                <th class="text-center">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela-itens">

                        </tbody>
                    </table>
                </div>


                <div class="row align-items-center mt-3">
                    <div class="col-md-6">
                        <h3 class="fw-bold mb-0">Total: R$ <span id="valor_total_exibicao">0.00</span></h3>
                    </div>
                    <div class="col-md-6 text-end">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">FINALIZAR VENDA</button>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/cadastro_vendas.js"></script>
</body>
</html>
