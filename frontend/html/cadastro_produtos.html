<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/15474/15474969.png" type="image/x-icon">    
    <title>Cadastro de Produtos</title>
</head>

<body class="bg-body-secondary">

    <div id="navbar-container"></div>

    <main class="w-100">
        <h1 class="text-center py-5 fw-bold">CADASTRO DE PRODUTOS</h1>

        <div class="w-75 mx-auto">
            <form id="form-produto" class="card card-body bg-dark text-white border-secondary">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome do Produto</label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>

                    <div class="col-md-6">
                        <label for="categoria" class="form-label">Categoria</label>
                        <select class="form-select" id="categoria" required>
                            <option value="" selected disabled></option>
                            <option value="peças">Peças Mecânicas</option>
                            <option value="lubrificantes">Lubrificantes / Óleos</option>
                            <option value="pneus">Pneus e Rodas</option>
                            <option value="acessorios">Acessórios</option>
                            <option value="servicos">Mão de Obra / Serviço</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="preco_custo" class="form-label">Preço Custo (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="preco_custo">
                    </div>

                    <div class="col-md-4">
                        <label for="preco_venda" class="form-label">Preço Venda (R$)</label>
                        <input type="number" step="0.01" class="form-control" id="preco_venda" required>
                    </div>

                    <div class="col-md-4">
                        <label for="estoque" class="form-label">Estoque</label>
                        <input type="number" class="form-control" id="estoque" required>
                    </div>

                </div>
                <button type="submit" class="btn btn-success mt-4 w-100">SALVAR PRODUTO</button>
            </form>
        </div>
    </main>
        

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
</body>


</html>
